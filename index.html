<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naim Pro Cashbook</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        
        :root {
            --primary: #4834d4; --secondary: #6c5ce7; --bg: #f8f9fd;
            --card: #ffffff; --text: #2d3436; --plus: #10ac84; --minus: #ee5253;
            --shadow: 0 10px 30px rgba(72, 52, 212, 0.1);
        }

        body {
            background: var(--bg); color: var(--text); font-family: 'Hind Siliguri', sans-serif;
            margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent;
        }

        /* হেডার ডিজাইন */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; padding: 60px 20px 40px; text-align: center;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
        }

        /* কার্ড ডিজাইন */
        .main-card {
            background: var(--card); margin: -30px 15px 15px; padding: 25px;
            border-radius: 30px; box-shadow: var(--shadow);
        }

        .bike-box {
            background: linear-gradient(45deg, #6c5ce7, #a29bfe); color: white;
            padding: 20px; border-radius: 25px; margin: 0 15px 15px;
        }

        /* ইনপুট ও বাটন */
        input, textarea {
            width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 18px;
            border: 1px solid #eee; outline: none; font-size: 16px; box-sizing: border-box; background: #fafafa;
        }

        .type-selector { display: flex; gap: 10px; margin: 15px 0; }
        .t-btn {
            flex: 1; padding: 15px; border-radius: 18px; border: 2px solid #eee;
            text-align: center; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .t-btn.active-plus { border-color: var(--plus); background: var(--plus); color: white; }
        .t-btn.active-minus { border-color: var(--minus); background: var(--minus); color: white; }

        .btn-submit {
            width: 100%; padding: 18px; border-radius: 20px; border: none;
            background: var(--primary); color: white; font-size: 18px; font-weight: bold;
            box-shadow: 0 8px 20px rgba(72, 52, 212, 0.3);
        }

        /* ইতিহাস তালিকা */
        .item {
            background: white; margin: 10px 15px; padding: 18px; border-radius: 22px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }

        /* কাস্টম এক্সিট পপ-আপ (সবচাইতে হাই-কোয়ালিটি) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; align-items: center;
            justify-content: center; z-index: 10000;
        }
        .modal-box {
            background: white; padding: 30px; border-radius: 30px; width: 80%; text-align: center;
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-yes { flex: 1; background: var(--minus); color: white; padding: 12px; border-radius: 15px; border: none; font-weight: bold; }
        .btn-no { flex: 1; background: var(--plus); color: white; padding: 12px; border-radius: 15px; border: none; font-weight: bold; }

        #toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 12px 30px; border-radius: 50px;
            transition: 0.5s; z-index: 20000;
        }
        #toast.show { bottom: 40px; }
    </style>
</head>
<body>

<div id="toast"></div>

<div id="exit-modal" class="modal-overlay">
    <div class="modal-box">
        <h3 style="margin:0;">অ্যাপ থেকে বের হতে চান?</h3>
        <p style="color:#666;">আপনার সকল হিসাব সেভ করা আছে।</p>
        <div class="modal-btns">
            <button class="btn-yes" onclick="confirmExit()">হ্যাঁ</button>
            <button class="btn-no" onclick="closeModal()">না</button>
        </div>
    </div>
</div>

<div id="main-app">
    <div class="header">
        <p style="opacity:0.8; margin:0;">হ্যালো নাঈম, আপনার মোট ব্যালেন্স</p>
        <h1 id="total-bal" style="font-size:45px; margin:5px 0;">৳ ০</h1>
    </div>

    <div class="bike-box">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span>🏍️ RTR 160 4V লক্ষ্য</span>
            <span id="percent">0%</span>
        </div>
        <h2 id="bike-fund" style="margin:0 0 10px 0;">৳ ০</h2>
        <div style="width:100%; height:8px; background:rgba(255,255,255,0.2); border-radius:10px; overflow:hidden;">
            <div id="bar" style="width:0%; height:100%; background:white; transition:1s;"></div>
        </div>
    </div>

    <div class="main-card">
        <input type="number" id="amt" placeholder="টাকার পরিমাণ (৳)" inputmode="numeric">
        <textarea id="note" placeholder="লেনদেনের বিবরণ..."></textarea>
        <div class="type-selector">
            <div id="p-btn" class="t-btn active-plus" onclick="setMode('plus')">জমা (+)</div>
            <div id="m-btn" class="t-btn" onclick="setMode('minus')">খরচ (-)</div>
        </div>
        <button class="btn-submit" onclick="addEntry()">হিসাব যোগ করুন 🚀</button>
    </div>

    <div id="history"></div>
    <div style="height:50px;"></div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('naim_simple_db')) || [];
    let currentMode = 'plus';

    // ব্যাক বাটন ম্যাজিক
    history.pushState(null, null, location.href);
    window.onpopstate = function() {
        document.getElementById('exit-modal').style.display = 'flex';
        history.pushState(null, null, location.href);
    };

    function closeModal() { document.getElementById('exit-modal').style.display = 'none'; }
    function confirmExit() { window.location.href = "about:blank"; }

    function setMode(m) {
        currentMode = m;
        document.getElementById('p-btn').className = 't-btn' + (m==='plus'?' active-plus':'');
        document.getElementById('m-btn').className = 't-btn' + (m==='minus'?' active-minus':'');
    }

    function addEntry() {
        const val = Number(document.getElementById('amt').value);
        const note = document.getElementById('note').value || "বিবরণ নেই";
        if (!val) return showToast("টাকা লিখুন!");

        db.push({ a: currentMode === 'minus' ? -val : val, n: note, d: new Date().toLocaleString('bn-BD') });
        localStorage.setItem('naim_simple_db', JSON.stringify(db));
        render();
        document.getElementById('amt').value = '';
        document.getElementById('note').value = '';
        showToast("সফলভাবে যোগ হয়েছে ✅");
    }

    function render() {
        const list = document.getElementById('history');
        list.innerHTML = ''; let total = 0;
        db.slice().reverse().forEach(i => {
            total += i.a;
            list.innerHTML += `<div class="item" style="border-left: 5px solid ${i.a>0?'var(--plus)':'var(--minus)'}">
                <div><b>${i.n}</b><br><small style="opacity:0.6;">${i.d}</small></div>
                <div style="color:${i.a>0?'var(--plus)':'var(--minus)'}; font-weight:800;">${i.a>0?'+':''}${i.a}</div>
            </div>`;
        });
        document.getElementById('total-bal').innerText = `৳ ${total}`;
        let bike = total * 0.8;
        let p = Math.min((bike/150000)*100, 100).toFixed(1);
        document.getElementById('bike-fund').innerText = `৳ ${Math.floor(bike)}`;
        document.getElementById('percent').innerText = p + '%';
        document.getElementById('bar').style.width = p + '%';
    }

    function showToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    render();
</script>
</body>
</html>
